spring:
  application:
    name: code-father
  #mysql
  datasource:
    url: jdbc:mysql://localhost:3306/code_father
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6378
      ttl: 3600
  session:
    store-type: redis
    timeout: 2592000

server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  group-configs:
    group: 'default'
    packages-to-scan: com.lyh.codefather.controller
  api-docs:
    path: /v3/api-docs

# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: your-custom-domain.com
    secretId: your-secret-id
    secretKey: your-secret-key
    region: ap-shanghai
    bucket: your-bucket-name

