spring:
  application:
    name: code-father
  #mysql
  datasource:
    url: jdbc:mysql://localhost:3306/code_father
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    active: local

server:
  port: 8123
  servlet:
    context-path: /api

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  group-configs:
    group: 'default'
    packages-to-scan: com.lyh.codefather.controller
  api-docs:
    path: /v3/api-docs
